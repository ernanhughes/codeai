[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeai"
version = "0.1.0"
description = "A durable epistemic runtime for heterogeneous AI collaboration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
